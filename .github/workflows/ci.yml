name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Линт и типы
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  build:
    name: Сборка (Windows)
    needs: check
    runs-on: windows-latest
    # На тег vX.Y.Z нужен contents: write — electron-builder публикует релиз через GH_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — шагу «Описание релиза» ниже нужны вся история и теги,
          # чтобы найти предыдущий vX.Y.Z и собрать список коммитов после него.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Без этого шага Windows-сборка уезжает без winws.exe: extraResources в
      # electron-builder.yml просто копирует resources/zapret, а он у чистого чекаута пуст.
      - run: node scripts/fetch-zapret.mjs

      # Подпись не настроена: артефакты неподписанные.
      # Чтобы подписывать — добавьте секреты CSC_LINK, CSC_KEY_PASSWORD и передайте их в env.
      #
      # На пуш тега vX.Y.Z (см. on.push.tags выше) electron-builder публикует .exe в GitHub
      # Release с этим тегом (создаёт его, если нет), используя repository из package.json.
      # На push в main/PR публикации нет — только упаковка и загрузка в Artifacts ниже.
      - name: Build
        run: npx --no-install electron-vite build && npx --no-install electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder создаёт релиз с пустым описанием, поэтому список изменений
      # дописываем сами: коммиты между предыдущим тегом vX.Y.Z и текущим.
      - name: Описание релиза
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # Предыдущий тег vX.Y.Z, начиная от родителя текущего. Пусто, если релиз первый.
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            if [ -n "$PREV" ]; then
              echo "## Изменения с $PREV"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..$TAG"
              echo
              echo
              echo "**Полный diff:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            else
              echo "## Изменения"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$TAG"
              echo
            fi
          } > "$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: rknboost-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
